<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #174a70;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #b8d3e5;
        }

        input {
            padding: 10px;
            margin: 5px 0;
            width: 95%;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            margin: 5px 2px;
            border: none;
            border-radius: 6px;
            background: #2476ad;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #174a70;
        }

        .delete {
            background: #d9534f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #2476ad;
            color: white;
        }

        #message {
            color: #174a70;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📚 Library Management System</h1>

    <h3>Add a Book</h3>

    <input type="text" id="bookId" placeholder="Enter Book ID">
    <input type="text" id="bookName" placeholder="Enter Book Name">
    <input type="text" id="author" placeholder="Enter Author Name">

    <button onclick="addBook()">Add Book</button>

    <h3>Search Books</h3>
    <input type="text" id="search" placeholder="Search by book name or author"
           oninput="displayBooks()">

    <p id="message"></p>

    <h3>Book Details</h3>

    <table>
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookList"></tbody>
    </table>
</div>

<script>
    let books = JSON.parse(localStorage.getItem("libraryBooks")) || [];

    function saveBooks() {
        localStorage.setItem("libraryBooks", JSON.stringify(books));
    }

    function addBook() {
        let id = document.getElementById("bookId").value.trim();
        let name = document.getElementById("bookName").value.trim();
        let author = document.getElementById("author").value.trim();

        if (id === "" || name === "" || author === "") {
            alert("Please fill in all fields!");
            return;
        }

        if (books.some(book => book.id.toLowerCase() === id.toLowerCase())) {
            alert("Book ID already exists!");
            return;
        }

        books.push({
            id: id,
            name: name,
            author: author,
            status: "Available"
        });

        saveBooks();
        displayBooks();

        document.getElementById("bookId").value = "";
        document.getElementById("bookName").value = "";
        document.getElementById("author").value = "";

        document.getElementById("message").textContent =
            "Book added successfully!";
    }

    function displayBooks() {
        let list = document.getElementById("bookList");
        let search = document.getElementById("search").value.toLowerCase();

        list.innerHTML = "";

        let filteredBooks = books.filter(book =>
            book.name.toLowerCase().includes(search) ||
            book.author.toLowerCase().includes(search) ||
            book.id.toLowerCase().includes(search)
        );

        filteredBooks.forEach(book => {
            let row = document.createElement("tr");

            [book.id, book.name, book.author, book.status].forEach(value => {
                let cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            let actionCell = document.createElement("td");

            let borrowButton = document.createElement("button");
            borrowButton.textContent =
                book.status === "Available" ? "Borrow" : "Return";

            borrowButton.onclick = function () {
                book.status =
                    book.status === "Available" ? "Borrowed" : "Available";
                saveBooks();
                displayBooks();
            };

            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";

            deleteButton.onclick = function () {
                if (confirm("Do you want to delete this book?")) {
                    books = books.filter(item => item.id !== book.id);
                    saveBooks();
                    displayBooks();
                }
            };

            actionCell.appendChild(borrowButton);
            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);
            list.appendChild(row);
        });

        document.getElementById("message").textContent =
            "Total books: " + books.length;
    }

    displayBooks();
</script>

</body>
</html>
